<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Video Downloader Local</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="dot" id="status-dot"></span>
      <span class="title">Video Downloader Local</span>
      <span class="status" id="status">comprobando&hellip;</span>
    </header>

    <main>
      <form id="download-form">
        <label for="url">URL del vídeo</label>
        <input id="url" type="text" placeholder="https://&hellip;" spellcheck="false" />

        <div class="row">
          <div class="field">
            <label for="format">Tipo</label>
            <select id="format">
              <option value="video">Vídeo</option>
              <option value="audio">Audio</option>
            </select>
          </div>
          <div class="field">
            <label for="container">Contenedor</label>
            <select id="container">
              <option value="mp4">MP4</option>
              <option value="webm">WebM</option>
              <option value="avi">AVI</option>
            </select>
          </div>
          <div class="field">
            <label for="quality">Calidad</label>
            <select id="quality">
              <option value="best">Analiza la URL primero</option>
            </select>
          </div>
        </div>

        <label for="directory">Carpeta de descarga</label>
        <input id="directory" type="text" placeholder="Usar carpeta configurada" spellcheck="false" />
        <button id="choose-directory" type="button">Elegir carpeta</button>

        <button id="download" type="submit" class="primary">Descargar</button>
        <p class="error" id="form-error" hidden></p>
      </form>

      <section class="recent">
        <h2>Descargas</h2>
        <p class="empty" id="empty" hidden>Sin descargas.</p>
        <ul id="list"></ul>
      </section>
    </main>

    <footer>
      <button id="open-options" type="button">Opciones</button>
      <button id="open-ui" type="button">Abrir panel</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
