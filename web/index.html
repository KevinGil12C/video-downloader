<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Downloader Local</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #1c1e21;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e8eaed; }
      }
      .card {
        padding: 2rem 2.5rem;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        .card { background: #1b1f27; }
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
      p { margin: 0.25rem 0; opacity: 0.8; }
      .version { font-size: 0.85rem; opacity: 0.6; }
      a { color: #2d7ff9; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Video Downloader Local</h1>
      <p>La interfaz de escritorio se construye en la fase de frontend.</p>
      <p class="version">Backend disponible en <span id="backend-status">comprobando&hellip;</span></p>
      <p class="version"><a href="/docs">Documentación del API (Swagger)</a></p>
    </main>
    <script src="/eel.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const url = "http://127.0.0.1:8000/api/health";
        const status = document.getElementById("backend-status");
        fetch(url)
          .then((res) => (res.ok ? res.json() : Promise.reject(new Error("offline"))))
          .then((data) => {
            status.textContent = "online v" + data.version;
          })
          .catch(() => {
            status.textContent = "offline";
          });
        if (window.eel) {
          eel.get_app_info()(function (info) {
            status.textContent += " \u00b7 " + info.version;
          });
        }
      });
    </script>
  </body>
</html>
