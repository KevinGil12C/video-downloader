<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Downloader Local</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Video Downloader Local</h1>
        <p class="tagline">Descarga vídeos y audio de forma local.</p>
      </div>
      <div class="backend-info" id="info">comprobando backend&hellip;</div>
    </header>

    <main>
      <section class="card">
        <h2>Nueva descarga</h2>
        <form id="download-form" class="download-form">
          <label for="url">URL del vídeo</label>
          <input
            id="url"
            name="url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
            spellcheck="false"
          />

          <div class="form-grid">
            <div class="field">
              <label for="format">Formato</label>
              <select id="format" name="format">
                <option value="video" selected>Vídeo</option>
                <option value="audio">Audio (MP3)</option>
              </select>
            </div>

            <div class="field">
              <label for="quality">Calidad</label>
              <select id="quality" name="quality">
                <option value="best" selected>Máxima</option>
                <option value="2160">2160p (4K)</option>
                <option value="1440">1440p</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
                <option value="240">240p</option>
              </select>
            </div>

            <div class="field field-wide">
              <label for="directory">Subcarpeta (opcional)</label>
              <input
                id="directory"
                name="directory"
                type="text"
                placeholder="p. ej. tutoriales"
                spellcheck="false"
              />
            </div>
          </div>

          <button id="submit" class="btn btn-primary" type="submit">
            Descargar
          </button>
        </form>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Descargas</h2>
          <button id="refresh" class="btn btn-ghost" type="button">
            Actualizar
          </button>
        </div>
        <p id="empty" class="empty" hidden>
          Todavía no hay descargas. Pega una URL arriba para empezar.
        </p>
        <div id="downloads" class="downloads" role="list"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Open source &middot; API local solo en 127.0.0.1</span>
      <span><a href="/docs">Swagger</a></span>
    </footer>

    <script src="/eel.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
